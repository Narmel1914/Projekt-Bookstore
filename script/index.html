<!doctype html>
<html lang="de">
  <head>
    <meta
      charset="UTF-8"
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <!-- Bootstrap file connected-->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <title>Document</title>
    <script src="../Row-data/db.js" defer></script>
    <script src="../script/template.js" defer></script>
    <script src="../script/script.js" defer></script>

    <link rel="stylesheet" href="../style/mainBookstore.css" />
    <link rel="stylesheet" href="../style/singleBook.css" />

    <!-- <link rel="icon" type="Icons/Group.png" href="icons/Group.png" />  important-->
  </head>

  <body>
    <header>
      <div class="logo-und-titel">
        <div class="logo">
          <img src="../assets/icons/book.png" alt="Book" />
        </div>
        <div class="book-store-header">
          <h3><span>DA</span>Bookstore-get your book here</h3>
        </div>
      </div>
    </header>
    <main>
      <section class="main-bookstore">
        <div class="card-book">
          <div class="name-book">
            <h2 id="card-book-name"></h2>
          </div>
          <hr />
          <div id="card-book-img" class="img-book">image book hier</div>
          <hr />
          <div class="card-book-property">
            <div class="card-price-likes-counter">
              <div class="book-price text-danger">
                <p id="card-book-price"></p>
              </div>
              <div class="card-likes-counter">
                <div class="book-likes">
                  <p id="card-book-likes"></p>
                </div>
                <div class="book-liked">
                  <div class="is-liked">
                    <i
                      class="bi bi-heart-fill text-danger"
                      id="heart-button"
                      role="button"
                      <!--onclick="UpCounter_DownCounter()"-->
                    </i>
                  </div>
               
                </div>
              </div>
            </div>

            <div class="card-book-reference">
              <div class="book-author">
                <p id="card-book-author"></p>
              </div>

              <div class="book-publishedYear">
                <p id="card-book-publishedYear"></p>
              </div>

              <div class="book-genre">
                <p id="card-book-genre"></p>
              </div>
            </div>
          </div>
          <hr />
          <div class="card-receveid-comment">
            <div class="title-comment">Kommentare</div>
            <div class="card-book-all-comment">
              <div class="card-book-id-comment">
                <div id="book-comment-name">name-cter</div>
                <div id="book-comment">comment</div>
              </div>

              <div class="scroll-bar">scroll bar see</div>
            </div>
          </div>
          <hr />
          <div class="card-book-send-comment">
            <div class="card-get-comment">
              <input type="text" id="get-comment" />
            </div>
            <div class="card-icon-commnent">
              <a href="https://icons.getbootstrap.com/icons/send/"></a>
              <!--<button
                type="button"
                id="send-comment"
                class="btn btn-default btn-sm"
              >
                <span class="glyphicon glyphicon-send"></span> Send
              </button>-->
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
